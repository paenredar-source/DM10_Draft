html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.4 var(--body)}
.wrap{max-width:900px;margin:0 auto;padding:16px 14px 48px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font:700 40px/1 var(--title);letter-spacing:.5px;margin:0}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
button,.btn{font:600 15px var(--body);border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer}
button:focus-visible,a:focus-visible,th:focus-visible,tr:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font:700 30px/1.05 var(--title);font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:13px}
.tablebox{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:0}
th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font:600 14px var(--body);color:var(--muted);cursor:pointer;user-select:none;position:sticky;top:0;background:var(--card)}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
td:first-child,th:first-child{position:sticky;left:0;background:var(--card);z-index:1}
tbody tr:last-child td{border-bottom:0}
tr.row{cursor:pointer} tr.row:hover td{background:color-mix(in srgb,var(--sea) 8%,var(--card))}
.team{font:600 19px/1 var(--title);letter-spacing:.3px;display:block;max-width:96px;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--muted);font-style:italic}
td.wrapcell{white-space:normal;position:static}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:5px;min-width:70px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good)}
.free{font:700 22px/1 var(--title)}
.c-good{color:var(--good)} .c-warn{color:var(--warn)} .c-bad{color:var(--bad)}
.bg-warn i{background:var(--warn)} .bg-bad i{background:var(--bad)}
.badge{display:inline-block;min-width:26px;text-align:center;font:600 13px var(--body);padding:2px 8px;border-radius:99px;border:1px solid var(--line)}
.y1{background:color-mix(in srgb,var(--warn) 18%,transparent)} .y2{background:color-mix(in srgb,var(--sea) 14%,transparent)} .y3{background:color-mix(in srgb,var(--good) 20%,transparent)}
.back{margin-bottom:12px;display:inline-block}
.head{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.head h2{font:700 38px/1 var(--title);margin:0 0 10px}
.head .big{font:700 46px/1 var(--title);font-variant-numeric:tabular-nums}
.head .bar{height:10px;border-radius:5px}
.meta{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-top:8px}
tfoot td{font-weight:600;background:color-mix(in srgb,var(--sea) 7%,var(--card))}
.note{color:var(--muted);font-size:13px;margin-top:12px}
.warnbox{color:var(--bad);font-weight:600;margin-top:8px}
@media (max-width:520px){h1{font-size:34px}.kpi b{font-size:26px}}

    const timer = setTimeout(()=>{ done(); reject(new Error("Timeout")); }, 15000);
    window[cb] = data => { done(); resolve(data); };
    s.onerror = () => { done(); reject(new Error("Script blockiert/nicht geladen")); };
    s.src = `https://docs.google.com/spreadsheets/d/${CONFIG.sheetId}/gviz/tq?tqx=out:json;responseHandler:${cb}&headers=1${tabParam}`;
    document.head.appendChild(s);
  });
}

async function getJson(tabParam){
  try {
    const url = `https://docs.google.com/spreadsheets/d/${CONFIG.sheetId}/gviz/tq?tqx=out:json&headers=1${tabParam}&_=${Date.now()}`;
    const res = await fetch(url,{cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const txt = await res.text();
    const s = txt.indexOf("{"), e = txt.lastIndexOf("}");
    if(s<0||e<0) throw new Error("Antwort ist kein JSON (Sheet nicht öffentlich?)");
    return JSON.parse(txt.slice(s,e+1));
  } catch(e1){
    console.warn("fetch fehlgeschlagen, versuche JSONP", e1);
    try { return await jsonpTab(tabParam); }
    catch(e2){ throw new Error(e1.message+" / JSONP: "+e2.message); }
  }
}

async function fetchTab(tabParam){
  const json = await getJson(tabParam);
  if(json.status==="error") throw new Error((json.errors&&json.errors[0]&&json.errors[0].detailed_message)||"Fehler von Google");
  let cols = json.table.cols.map(c=>String(c.label||"").trim().toLowerCase());
  let rows = json.table.rows;
  let off = 0;
  if(!cols.includes("jugador") && rows.length){ // Kopfzeile wurde als Daten geliefert
    cols = (rows[0].c||[]).map(c=>String((c&&c.v)||"").trim().toLowerCase()); rows = rows.slice(1);
  }
  const idx = n => cols.indexOf(n.toLowerCase());
  const I = {tipo:idx("Tipo"),name:idx("Jugador"),fppg:idx("FPPG"),letra:idx("Letra"),edad:idx("Edad"),sal:idx("Salario"),years:idx("Años"),owner:idx("OWNER")};
  if(I.name<0||I.sal<0||I.owner<0) throw new Error("Spalten nicht gefunden (gelesen: "+cols.filter(Boolean).slice(0,6).join(", ")+")");
  const val = (row,i)=> i<0||!row.c||!row.c[i] ? null : row.c[i].v;
  const out = rows.map(r=>({
    tipo:val(r,I.tipo), name:val(r,I.name), fppg:num(val(r,I.fppg)), letra:val(r,I.letra), edad:num(val(r,I.edad)),
    sal:num(val(r,I.sal)), years:num(val(r,I.years)), owner:val(r,I.owner)
  })).filter(p=>p.name);
  if(!out.length) throw new Error("Keine Daten");
  return out;
}

async function fromSheet(){
  const tries = ["&sheet="+encodeURIComponent(CONFIG.sheetName), ""]; // erst per Tab-Name, dann erster Tab
  const errs = [];
  for(const t of tries){
    try { return await fetchTab(t); } catch(e){ errs.push(e.message); console.warn("Sheet-Abruf fehlgeschlagen",t,e); }
  }
  throw new Error(errs.join(" | "));
}

async function load(){
  $("#status").textContent = "Cargando…";
  try { players = await fromSheet(); source = "En vivo desde Google Sheet"; }
  catch(e){ players = fromSnapshot(); source = "Datos del Excel (Sheet no accesible: "+e.message+")"; console.warn(e); }
  render();
}

/* ===== Data ===== */
function teamsData(){
  const map = new Map();
  for(const p of players){
    if(!isNamed(p.owner)) continue;
    const k = String(p.owner).trim();
    if(!map.has(k)) map.set(k,{name:k,players:[]});
    map.get(k).players.push(p);
  }
  return [...map.values()].map(t=>{
    t.spent = t.players.reduce((s,p)=>s+(p.sal||0),0);
    t.free = CONFIG.cap - t.spent;
    t.n = t.players.length;
    return t;
  });
}

/* ===== Views ===== */
function level(free){ return free<=0?"bad": free<=10?"warn":"good"; }
function bar(t,h){
  const pct = Math.max(0,Math.min(100,t.free/CONFIG.cap*100)), lv=level(t.free);
  return `<div class="bar ${lv==="good"?"":"bg-"+lv}" ${h?`style="height:${h}px"`:""}><i style="width:${pct}%"></i></div>`;
}

function listView(){
  const teams = teamsData(), drafted = players.filter(p=>isNamed(p.owner)).length;
  const k = sortState.key, d = sortState.dir;
  teams.sort((a,b)=>{ const x=k==="name"?a.name.localeCompare(b.name,"es"):a[k], y=k==="name"?0:b[k]; return k==="name"?x*d:(x-y)*d || a.name.localeCompare(b.name,"es"); });
  const open = CONFIG.teams - teams.length;
  const arrow = key => sortState.key===key ? (sortState.dir>0?" ↑":" ↓") : "";
  const rows = teams.map(t=>`<tr class="row" tabindex="0" data-team="${esc(t.name)}">
    <td><span class="team">${esc(t.name)}</span></td>
    <td class="num">${fmt(t.spent)} M</td>
    <td class="num"><span class="free c-${level(t.free)}">${fmt(t.free)} M</span>${bar(t)}</td>
    <td class="num">${t.n}<span class="empty"> / ${CONFIG.rosterMax}</span></td></tr>`).join("");
  const placeholders = open>0 ? `<tr><td colspan="4" class="empty wrapcell">${open} equipos aún sin nombre: aparecerán aquí cuando el nombre figure en la columna OWNER del Sheet.</td></tr>` : "";
  return `
  <div class="kpis">
    <div class="kpi"><b>${teams.length} / ${CONFIG.teams}</b><span>Equipos con nombre</span></div>
    <div class="kpi"><b>${drafted}</b><span>Jugadores drafteados</span></div>
    <div class="kpi"><b>${fmt(CONFIG.cap,0)} M</b><span>Cap por equipo</span></div>
  </div>
  <div class="tablebox"><table><thead><tr>
    <th data-sort="name">Equipo${arrow("name")}</th><th class="num" data-sort="spent">Salarios${arrow("spent")}</th><th class="num" data-sort="free">Libre${arrow("free")}</th>
    <th class="num" data-sort="n">Jugad.${arrow("n")}</th>
  </tr></thead><tbody>${rows}${placeholders}</tbody></table></div>
  <div class="note">Toca un equipo para ver su plantilla. Pulsa las cabeceras para ordenar.</div>`;
}

function teamView(name){
  const t = teamsData().find(x=>x.name===name);
  if(!t) return `<a class="btn back" href="#">‹ Todos los equipos</a><p class="empty">Equipo no encontrado.</p>`;
  const k = playerSort.key, d = playerSort.dir;
  const list = [...t.players].sort((a,b)=>{
    const x = k==="name"?String(a.name):(a[k]??-1), y = k==="name"?String(b.name):(b[k]??-1);
    return (k==="name"?x.localeCompare(y,"es"):x-y)*d;
  });
  const arrow = key => playerSort.key===key ? (playerSort.dir>0?" ↑":" ↓") : "";
  const rows = list.map(p=>`<tr>
    <td>${esc(p.name)}</td><td>${esc(p.letra||"")}</td>
    <td class="num">${fmt(p.sal||0)} M</td>
    <td class="num"><span class="badge y${p.years}">${p.years??"–"}</span></td></tr>`).join("");
  const warn = t.n>CONFIG.rosterMax ? `<div class="warnbox">Más de ${CONFIG.rosterMax} jugadores en la plantilla.</div>` : t.free<0 ? `<div class="warnbox">Cap superado en ${fmt(-t.free)} M.</div>` : "";
  return `<a class="btn back" href="#">‹ Todos los equipos</a>
  <div class="head"><h2>${esc(t.name)}</h2>
    <div class="big c-${level(t.free)}">${fmt(t.free)} M <span class="sub">libre de ${fmt(CONFIG.cap,0)} M</span></div>
    ${bar(t,10)}
    <div class="meta"><span>${t.n} de ${CONFIG.rosterMax} jugadores${t.n<CONFIG.rosterMin?` (mínimo ${CONFIG.rosterMin})`:""}</span><span>Salarios ${fmt(t.spent)} M</span></div>${warn}
  </div>
  <div class="tablebox"><table><thead><tr>
    <th data-psort="name">Jugador${arrow("name")}</th><th data-psort="letra">Pos.${arrow("letra")}</th>
    <th class="num" data-psort="sal">Salario${arrow("sal")}</th><th class="num" data-psort="years">Años${arrow("years")}</th>
  </tr></thead><tbody>${rows||`<tr><td colspan="4" class="empty wrapcell">Aún no hay jugadores drafteados.</td></tr>`}</tbody>
  <tfoot><tr><td>Total</td><td></td><td class="num">${fmt(t.spent)} M</td><td></td></tr></tfoot></table></div>`;
}

function render(){
  const h = decodeURIComponent(location.hash.slice(1));
  $("#app").innerHTML = h.startsWith("team=") ? teamView(h.slice(5)) : listView();
  $("#status").textContent = source;
}

/* ===== Events ===== */
document.addEventListener("click",e=>{
  const th = e.target.closest("th[data-sort]"), ph = e.target.closest("th[data-psort]"), row = e.target.closest("tr[data-team]");
  if(th){ const k=th.dataset.sort; sortState = sortState.key===k ? {key:k,dir:-sortState.dir} : {key:k,dir:k==="name"?1:(k==="free"?1:-1)}; render(); }
  else if(ph){ const k=ph.dataset.psort; playerSort = playerSort.key===k ? {key:k,dir:-playerSort.dir} : {key:k,dir:(k==="name"||k==="letra")?1:-1}; render(); }
  else if(row){ location.hash = "team="+encodeURIComponent(row.dataset.team); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Enter"){ const row=e.target.closest&&e.target.closest("tr[data-team]"); if(row) location.hash="team="+encodeURIComponent(row.dataset.team);} });
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0);});
$("#reload").addEventListener("click",load);
load();
</script>
